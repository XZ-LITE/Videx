name: 🐛 Отчет об ошибке (Bug Report)
description: Сообщить об ошибке, баге или сбое в работе приложения Videx
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Спасибо за помощь в улучшении Videx! Опишите проблему максимально подробно.
  - type: textarea
    id: description
    attributes:
      label: Описание проблемы
      description: Что именно произошло и при каких действиях?
      placeholder: Опишите подробно, с какой ошибкой или багом вы столкнулись...
    validations:
      required: true
  - type: input
    id: media_url
    attributes:
      label: Проблемная ссылка (если относится к ошибке)
      description: Укажите ссылку на медиафайл, если баг связан со скачиванием
      placeholder: https://www.youtube.com/watch?v=...
  - type: dropdown
    id: android_version
    attributes:
      label: Версия Android
      options:
        - Android 15
        - Android 14
        - Android 13
        - Android 12 / 12L
        - Android 11
        - Android 10
        - Android 8 / 9
    validations:
      required: true
  - type: input
    id: device_model
    attributes:
      label: Модель смартфона
      placeholder: Например, Samsung Galaxy S23, Xiaomi Redmi Note 12
  - type: textarea
    id: logs
    attributes:
      label: Системные логи из приложения
      description: Скопируйте и вставьте текст из раздела Настройки -> Системные логи
      render: text
